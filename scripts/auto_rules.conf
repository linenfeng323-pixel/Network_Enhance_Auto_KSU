# ======================================================================
# auto_rules.conf — Network Enhance Auto (KSU) 全自动场景规则
# ----------------------------------------------------------------------
# 引擎读取本文件自动判定当前场景。规则优先级:
#   app > motion(高铁/地铁/飞机) > charging > screen > cellloc > time > signal > default
# 注释行 # 开头,空行忽略。
# ======================================================================

# ----------------------------------------------------------------------
# 1. 主开关与节流参数
# ----------------------------------------------------------------------
AUTO_ENGINE_ENABLE=true

# 检测间隔 (秒, 默认 20)
AUTO_INTERVAL_SEC=20

# 模式切换最小间隔 (秒, 防抖, 默认 60)
AUTO_MIN_SWITCH_SEC=60

# 连续命中多少次才真正切换 (默认 2)
AUTO_CONFIRM_COUNT=2

# 异常自动修复 (WiFi 假连接重连 + 高丢包切 DNS)
AUTO_HEAL_ENABLE=true

# 高速移动判定参数
# 单位时间(秒)内基站 CID 变化次数 >= 此值 → 判定高速移动
MOTION_DETECT_WINDOW=120
MOTION_CID_CHANGE_THRESHOLD=3
# 速度估算 >= 此值 km/h → 判定高铁 (用 GPS, 无 GPS 则用基站切换频率)
MOTION_HIGH_SPEED_KMH=150

# 每日报告时间 (HH:MM, 留空则不推送)
AUTO_REPORT_TIME="21:00"

# ----------------------------------------------------------------------
# 2. App 前台规则 (最高优先级)
#    格式: app <模式> <包名1,包名2,...>
# ----------------------------------------------------------------------
app  game    com.miHoYo.GenshinImpact,com.miHoYo.Yuanshen,com.tencent.tmgp.pubgmhd,com.tencent.tmgp.sgame,com.netease.mrzh,com.tencent.tmgp.cfhd,com.miHoYo.GenshinImpact.bilibili
app  voip    com.tencent.wemeet,com.netease.vmeeting,com.discord,com.tencent.mobileqq,com.ss.android.ugc.aweme.lite
app  video   tv.danmaku.bili,com.youku.phone,com.qiyi.video,com.tencent.qqlive,com.ss.android.ugc.aweme,com.smile.gifmaker

# ----------------------------------------------------------------------
# 3. 运动场景 (通过基站切换频率 / GPS 速度自动识别)
#    格式: motion <模式> <类型>
#    类型: highspeed(高铁) | subway(地铁) | flight(飞机模式前优化) | static(静止)
# ----------------------------------------------------------------------
motion  highspeed  highspeed
motion  subway     subway
motion  flight     flight
motion  static     normal

# ----------------------------------------------------------------------
# 4. 充电状态
#    格式: charging <模式> <true|false>
# ----------------------------------------------------------------------
charging  normal    true
charging  powersave false

# ----------------------------------------------------------------------
# 5. 息屏状态
#    格式: screen <模式> <on|off>
# ----------------------------------------------------------------------
screen  powersave  off
screen  normal     on

# ----------------------------------------------------------------------
# 6. 基站位置 (用 CID 当指纹, 不耗电)
#    首次运行 `sh auto_engine.sh record home` 自动写入
# ----------------------------------------------------------------------
cellloc  powersave  __HOME_CIDS__
cellloc  normal     __WORK_CIDS__

# ----------------------------------------------------------------------
# 7. 时间段
#    格式: time <模式> <HH:MM-HH:MM> <星期 0=日 1-6=一至六 * 全部>
# ----------------------------------------------------------------------
time  powersave  23:00-07:00  *

# ----------------------------------------------------------------------
# 8. 信号触发
#    字段: wifi_rssi / cell_rsrp / cell_sinr / ping_ms / packet_loss
#    运算符: < <= > >= ==
#    多条件用 && 连接
# ----------------------------------------------------------------------
signal  weaknet    wifi_rssi < -80 && ping_ms > 150
signal  weaknet    cell_rsrp < -110
signal  powersave  wifi_rssi > -55 && ping_ms < 50

# ----------------------------------------------------------------------
# 9. 默认模式
# ----------------------------------------------------------------------
default  normal
